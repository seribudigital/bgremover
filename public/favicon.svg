<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Checkerboard grid subtle cutout pattern in background -->
  <g opacity="0.12">
    <rect x="10" y="10" width="8" height="8" fill="#ffffff" />
    <rect x="26" y="10" width="8" height="8" fill="#ffffff" />
    <rect x="42" y="10" width="8" height="8" fill="#ffffff" />
    <rect x="18" y="18" width="8" height="8" fill="#ffffff" />
    <rect x="34" y="18" width="8" height="8" fill="#ffffff" />
    <rect x="10" y="26" width="8" height="8" fill="#ffffff" />
    <rect x="26" y="26" width="8" height="8" fill="#ffffff" />
    <rect x="42" y="26" width="8" height="8" fill="#ffffff" />
    <rect x="18" y="34" width="8" height="8" fill="#ffffff" />
    <rect x="34" y="34" width="8" height="8" fill="#ffffff" />
    <rect x="10" y="42" width="8" height="8" fill="#ffffff" />
    <rect x="26" y="42" width="8" height="8" fill="#ffffff" />
    <rect x="42" y="42" width="8" height="8" fill="#ffffff" />
  </g>

  <!-- Modern Geometric "N" (Naqi) Shape with clean cutouts -->
  <path d="M16 46V18L32 36V18H38V46L22 28V46H16Z" fill="url(#primaryGrad)" filter="url(#glow)" />

  <!-- Precision Cut Diamond / Islamic 8-Point Star Accent at top right -->
  <path d="M46 12L48 17L53 19L48 21L46 26L44 21L39 19L44 17Z" fill="url(#sparkleGrad)" filter="url(#glow)" />
  
  <!-- Tiny pure sparkle dot -->
  <circle cx="20" cy="14" r="1.5" fill="#38bdf8" opacity="0.9" />
</svg>